{% extends "base.html" %}

{% block title %}Job Management - Task Scheduler{% endblock %}

{% block page_title %}ジョブ管理{% endblock %}

{% block content %}
<div class="row">
    <!-- Job List -->
    <div class="col-lg-12">
        <div class="card mb-4">
            <div class="card-header">
                <h2>登録済みジョブ一覧</h2>
                <button id="new-job-btn" class="btn btn-primary float-end">新規ジョブ作成</button>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" id="job-search-input" class="form-control" placeholder="ジョブIDまたは実行関数で検索...">
                    </div>
                    <div class="col-md-6">
                        <div class="btn-group" id="bulk-actions-group" style="display: none;">
                            <button id="bulk-pause-btn" class="btn btn-secondary">選択を一時停止</button>
                            <button id="bulk-resume-btn" class="btn btn-success">選択を再開</button>
                            <button id="bulk-delete-btn" class="btn btn-danger">選択を削除</button>
                        </div>
                    </div>
                </div>
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th scope="col"><input type="checkbox" id="select-all-jobs"></th>
                            <th scope="col">ステータス</th>
                            <th scope="col">ジョブID</th>
                            <th scope="col">スケジュール</th>
                            <th scope="col">次の実行時刻</th>
                            <th scope="col">実行関数</th>
                            <th scope="col">操作</th>
                        </tr>
                    </thead>
                    <tbody id="jobs-list-body">
                        <!-- Job rows will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create/Edit Job Form -->
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <h2 id="job-form-title">新規ジョブ作成</h2>
            </div>
            <div class="card-body">
                <form id="job-form" novalidate>
                    <input type="hidden" id="job-id-hidden">
                    
                    <!-- Basic Job Details -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="job-name" class="form-label">ジョブ名</label>
                            <input type="text" class="form-control" id="job-name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="job-description" class="form-label">説明</label>
                            <input type="text" class="form-control" id="job-description">
                        </div>
                    </div>

                    <hr>

                    <!-- Task Type and Parameters -->
                    <h5>タスク設定</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="task-select" class="form-label">タスク</label>
                            <select class="form-select" id="task-select">
                                <option value="" selected disabled>利用可能なタスクを読み込み中...</option>
                            </select>
                        </div>
                    </div>
                    <div id="dynamic-params-container" class="p-3 border rounded bg-light d-none">
                        <!-- Parameters will be dynamically inserted here -->
                    </div>
                    
                    <hr>

                    <h5>トリガー設定</h5>
                    <div class="mb-3">
                        <label for="trigger-type" class="form-label">トリガータイプ</label>
                        <select class="form-select" id="trigger-type">
                            <option value="cron">Cron</option>
                            <option value="interval">Interval</option>
                        </select>
                    </div>

                    <!-- Cron Fields -->
                    <div id="cron-fields">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="cron-minute" class="form-label">分</label>
                                <input type="text" class="form-control" id="cron-minute" value="*">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="cron-hour" class="form-label">時</label>
                                <input type="text" class="form-control" id="cron-hour" value="*">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="cron-day-of-week" class="form-label">曜日</label>
                                <input type="text" class="form-control" id="cron-day-of-week" value="*">
                            </div>
                        </div>
                    </div>

                    <!-- Interval Fields -->
                    <div id="interval-fields" class="d-none">
                        <div class="row">
                            <div class="col-md-3 mb-3">
                                <label for="interval-weeks" class="form-label">週</label>
                                <input type="number" class="form-control" id="interval-weeks" value="0">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="interval-days" class="form-label">日</label>
                                <input type="number" class="form-control" id="interval-days" value="0">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="interval-hours" class="form-label">時</label>
                                <input type="number" class="form-control" id="interval-hours" value="0">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="interval-minutes" class="form-label">分</label>
                                <input type="number" class="form-control" id="interval-minutes" value="5">
                            </div>
                        </div>
                    </div>

                    <hr>

                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="job-enabled" checked>
                        <label class="form-check-label" for="job-enabled">ジョブを有効にする</label>
                    </div>

                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-secondary" id="clear-form-btn">クリア</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='jobs.js') }}"></script>
{% endblock %}
